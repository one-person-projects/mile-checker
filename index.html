<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>マイル予約開始日チェッカー</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:540px;margin:35px auto}.card{background:white;border-radius:20px;padding:30px;box-shadow:0 8px 35px #17243b12}h1{font-size:1.55rem;margin:0 0 10px}p{line-height:1.65;color:#53627a}.field{margin-top:22px}label{font-weight:650;display:block;margin-bottom:9px}select,input,button{font:inherit;width:100%;border-radius:10px;padding:13px;border:1px solid #cbd5e1;background:white}button{margin-top:23px;background:#155eef;color:white;border:0;font-weight:700;cursor:pointer}button:hover{background:#1049bb}.result{margin-top:24px;padding:20px;border-radius:14px;background:#eff5ff}.result strong{display:block;font-size:1.55rem;margin:7px 0}.muted{font-size:.85rem;color:#5d6a7b}.links{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}a{color:#155eef}footer{margin-top:18px;font-size:.8rem;color:#65738a;line-height:1.7}@media(max-width:450px){.card{padding:22px}.wrap{margin:12px auto}}
</style></head><body><main class="wrap"><div class="card"><h1>✈ マイル予約開始日チェッカー</h1><p>ANA・JALの国内線特典航空券（一般会員・片道）の予約開始日時を計算します。</p><div class="field"><label for="airline">航空会社</label><select id="airline"><option value="ANA">ANA</option><option value="JAL">JAL</option></select></div><div class="field"><label for="flight">搭乗希望日</label><input id="flight" type="date"></div><button id="calc">予約開始日を計算</button><div class="result" id="result" aria-live="polite" hidden></div><div class="links"><a id="rules" href="https://www.ana.co.jp/ja/jp/guide/amc/award/domestic/reservation/" target="_blank" rel="noopener noreferrer">公式ルールを見る ↗</a><a id="booking" href="https://www.ana.co.jp/" target="_blank" rel="noopener noreferrer">航空会社サイトへ ↗</a></div><footer>予約開始日時は各社の公表ルールに基づく目安です。特典席の提供・空席を保証しません。対象外：往復同時予約、国際線、JAL先行予約対象会員など。公式サイトで最新情報を確認してください。</footer></div></main><script>
const config={ANA:{days:355,time:'09:00',rules:'https://www.ana.co.jp/ja/jp/guide/amc/award/domestic/reservation/',booking:'https://www.ana.co.jp/'},JAL:{days:360,time:'00:00',rules:'https://www.jal.co.jp/jp/ja/jalmile/use/jal/domestic-award/application.html',booking:'https://www.jal.co.jp/'}};
const $=id=>document.getElementById(id);const fmt=d=>`${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日（${'日月火水木金土'[d.getUTCDay()]}）`;
function updateLinks(){const c=config[$('airline').value];$('rules').href=c.rules;$('booking').href=c.booking;$('result').hidden=true}
$('airline').addEventListener('change',updateLinks);$('flight').addEventListener('change',()=>{$('result').hidden=true});
$('calc').addEventListener('click',()=>{const val=$('flight').value,el=$('result');el.hidden=false;if(!/^\d{4}-\d{2}-\d{2}$/.test(val)){el.textContent='搭乗希望日を選択してください。';return}const [y,m,d]=val.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d));if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d){el.textContent='有効な日付を入力してください。';return}const name=$('airline').value,c=config[name];const start=new Date(date.getTime()-c.days*86400000);const now=new Date();const currentJST=new Date(now.getTime()+9*3600000);const todayJST=new Date(Date.UTC(currentJST.getUTCFullYear(),currentJST.getUTCMonth(),currentJST.getUTCDate()));if(date<todayJST){el.textContent='過去の搭乗日は指定できません。';return}const startAt=new Date(start.getTime()+(Number(c.time.slice(0,2))-9)*3600000);const status=now>=startAt?'予約受付開始日時を過ぎています。':'予約受付開始前です。';const farFuture=startAt.getTime()-now.getTime()>365*86400000;const caution=farFuture?'<p class="muted" role="note">この予約開始日時は、現在のANA・JALの予約ルールに基づく参考計算です。将来、予約制度が変更される可能性があるため、予約前に航空会社の公式サイトをご確認ください。</p>':'';el.innerHTML=`<span class="muted">${name} 国内線・片道の予約開始日時</span><strong>${fmt(start)}</strong><div><b>${c.time}（日本時間）</b></div><p>${status}</p><span class="muted">搭乗日から${c.days}日前の計算です。実際の予約可否は公式サイトでご確認ください。</span>${caution}`});
</script></body></html>
